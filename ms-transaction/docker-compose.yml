name: ms-transaction

services:
  app:
    container_name: transaction-app
    build:
      context: .
      dockerfile: .docker/Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks: [ec-network]

  nginx:
    container_name: transaction-nginx
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8004:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [ec-network]

  db:
    container_name: transaction-db
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pay_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ec-network]

volumes:
  db_data:

networks:
  ec-network:
    external: true
